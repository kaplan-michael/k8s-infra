apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kaplan-web
  namespace: argocd
spec:
  destination:
    namespace: kaplan-web
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://github.com/kaplan-michael/website.git
    targetRevision: master
    path: deploy
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
