apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
  name: stroodle
  namespace: argocd
spec:
  destination:
    namespace: stroodle
    server: https://kubernetes.default.svc
  project: uragan
  source:
    repoURL: https://github.com/uragandevs/deployments.git
    targetRevision: main
    path: stroodle
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
